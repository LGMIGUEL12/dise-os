<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regalo de Cumpleaños</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fondo con luces desenfocadas -->
  <div class="bokeh" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <main class="stage">
    <h1 id="instructionText" class="instruction">Haz clic en el regalo...</h1>

    <div class="scene">
      <div class="float">
        <div id="giftBox" class="box" role="button" tabindex="0" aria-label="Abrir regalo">
          <div class="face bottom"></div>
          <div class="face side front"></div>
          <div class="face side back"></div>
          <div class="face side right"></div>
          <div class="face side left"></div>
          <div class="lid">
            <div class="lid-top"></div>
            <div class="lid-side l-front"></div>
            <div class="lid-side l-back"></div>
            <div class="lid-side l-right"></div>
            <div class="lid-side l-left"></div>
          </div>
        </div>
      </div>
      <div class="shadow"></div>
    </div>
  </main>

  <!-- Confeti -->
  <div id="confetti-container" class="confetti-container" aria-hidden="true"></div>

  <!-- Carta -->
  <div id="birthdayModal" class="modal" aria-hidden="true">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
      <button id="closeBtn" class="close-btn" aria-label="Cerrar">&times;</button>

      <!-- Fotos de la carpeta fotos/ -->
      <div class="photos photos-left">
        <figure class="photo"><span class="frame"><img src="fotos/1.jpg" alt="Foto 1"></span><span class="sticker">🎉</span></figure>
        <figure class="photo"><span class="frame"><img src="fotos/2.jpg" alt="Foto 2"></span><span class="sticker">🎂</span></figure>
        <figure class="photo"><span class="frame"><img class="trim" style="--origin: 27%" src="fotos/3.jpg" alt="Foto 3"></span><span class="sticker">🎈</span></figure>
      </div>

      <div class="card-center">
        <span class="deco">✨</span>
        <h2 id="cardTitle" class="card-title">¡Feliz Cumpleaños!</h2>
        <p class="card-text">
          Que tu día brille tanto como tú. ¡Espero que esté lleno de risas,
          regalos y todo lo que te hace feliz!
        </p>
        <span class="deco">💖</span>
      </div>

      <div class="photos photos-right">
        <figure class="photo"><span class="frame"><img src="fotos/4.jpg" alt="Foto 4"></span><span class="sticker">🎁</span></figure>
        <figure class="photo"><span class="frame"><img class="trim" style="--origin: 18%" src="fotos/5.jpg" alt="Foto 5"></span><span class="sticker">🥳</span></figure>
        <figure class="photo"><span class="frame"><img src="fotos/6.jpg" alt="Foto 6"></span><span class="sticker">🌸</span></figure>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
